# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format

[versions]
spring-boot = "4.1.0"
spotless = "8.9.0"
jspecify = "1.0.0"
errorprone-plugin = "5.1.0"
errorprone = "2.50.0"
nullaway = "0.13.8"
archunit = "1.5.0"
immutables = "2.12.2"
guava = "33.6.0-jre"

[libraries]
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
archunit = { module = "com.tngtech.archunit:archunit-junit6", version.ref = "archunit" }
immutables-annotation-processor = { module = "org.immutables:value", version.ref = "immutables" }
immutables-annotations = { module = "org.immutables:value-annotations", version.ref = "immutables" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }